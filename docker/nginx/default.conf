# Nginx do Taskon (container `taskon-nginx`) — front do PHP-FPM.
#
# `server_name _` + `default_server`: quem decide o domínio é o Traefik, que
# repassa o Host original. Fixar um server_name aqui só criaria uma segunda
# fonte da verdade para o mesmo dado.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Casa com upload_max_filesize/post_max_size do docker/php/php.ini.
    client_max_body_size 32m;

    fastcgi_read_timeout 120;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Assets do Vite: o nome traz hash de conteúdo, então cache longo é seguro.
    location ^~ /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Disco público do Laravel, servido direto de storage/app/public em vez de
    # depender do symlink public/storage — em bind mount do Windows a criação de
    # symlink pelo container falha sem o Modo Desenvolvedor ligado.
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /favicon.svg { access_log off; log_not_found off; expires 7d; }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        # ⚠️ Resolução em RUNTIME, não no boot. Com `fastcgi_pass taskon-app:9000`
        # o nginx congela o IP do container ao carregar a config — todo
        # `docker compose restart taskon-app` troca o IP e o site cai em 502 até
        # o nginx reiniciar também. Passando por variável + resolver do Docker
        # (127.0.0.11), cada request re-resolve o nome.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_app taskon-app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        # Neutraliza o header Proxy (httpoxy).
        fastcgi_param HTTP_PROXY "";

        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        internal;
    }

    # Nada além do index.php é executado como PHP.
    location ~ \.php$ {
        return 404;
    }

    # .env, .git, .htaccess... fora do ar.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
