; Ajustes do Taskon sobre o php.ini-production da imagem oficial.
; Carregado como conf.d/zz-taskon.ini (último a ser lido = vence).

memory_limit = 512M
max_execution_time = 120
max_input_time = 120

upload_max_filesize = 32M
post_max_size = 32M

; Mesmo fuso do app — evita divergência de horário entre PHP e Laravel no log.
date.timezone = America/Sao_Paulo

; ⚠️ PERFORMANCE — leia antes de mexer.
; O código vem por bind mount do Windows, onde cada stat() custa alguns
; milissegundos. Com o opcache revalidando arquivo a arquivo em toda request,
; isso vira segundos de I/O puro.
;   - validate_timestamps / revalidate_freq são sobrescritos em runtime pelo
;     entrypoint.sh, a partir de OPCACHE_VALIDATE_TIMESTAMPS e
;     OPCACHE_REVALIDATE_FREQ. Default: revalida, no máximo a cada 2 s.
;   - vendor/ (a maior parte dos arquivos de uma request) fica em VOLUME do
;     Docker, fora do bind mount — ver docker-compose.yml.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Resolver caminho também custa stat. Cache grande e longo derruba a maior parte
; das idas ao filesystem.
realpath_cache_size = 16M
realpath_cache_ttl = 600

; Erros vão para o stderr do container (Dozzle / docker compose logs), não para
; arquivo — em bind mount do Windows um log crescendo é sincronizado pelo OneDrive.
display_errors = Off
log_errors = On
error_log = /dev/stderr
