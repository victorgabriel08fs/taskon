# =============================================================================
#  Taskon atrás do Traefik  —  https://tasks.localhost
#
#  Segue o docker-compose.app-modelo.yml da infra:
#    - nenhuma porta publicada no host (quem expõe é o Traefik);
#    - nenhum banco/Mailpit próprio: usa os COMPARTILHADOS da infra, pelo nome
#      do container na rede 'web' ('mariadb', 'mailpit');
#    - sem label 'entrypoints', para o router responder em http:// E https://.
#
#  Pré-requisitos (uma vez):
#    1. A infra do Traefik no ar  (docker compose up -d na pasta da infra)
#    2. O banco criado:
#         docker exec -i mariadb mariadb -uroot -proot -e \
#           "CREATE DATABASE IF NOT EXISTS \`taskon\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
#    3. 'tasks.localhost' na lista $Dominios do gerar-certificados.ps1 da infra,
#       e o script rodado de novo — senão o navegador reclama do certificado.
#    4. Assets buildados no host:  npm run build
#
#  Subir:      docker compose up -d
#  Artisan:    docker compose exec taskon-app php artisan <comando>
#  Logs:       docker compose logs -f taskon-app   (ou https://logs.localhost)
# =============================================================================

name: taskon

# ---------------------------------------------------------------- blocos comuns
x-php-env: &php-env
  # Usado para gerar link FORA de um request (fila, e-mail, artisan). O que é
  # gerado DURANTE um request depende do TrustProxies — ver bootstrap/app.php.
  APP_URL: ${APP_URL:-https://tasks.localhost}

  # Banco CENTRAL da infra. 'mariadb' é o nome do container na rede 'web';
  # dentro da rede a porta é 3306 (a 3309 do host é só para clientes de fora).
  DB_CONNECTION: mysql
  DB_HOST: mariadb
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-taskon}
  DB_USERNAME: ${DB_USERNAME:-dev}
  DB_PASSWORD: ${DB_PASSWORD:-dev}

  # Mailpit CENTRAL: todo e-mail (ex.: link de recuperação de senha) cai em
  # https://mail.localhost e nada sai para a internet. 1025 é o SMTP — a 8025 é
  # a interface web, que só o Traefik acessa.
  #
  # ⚠️ 'mailpit-central', e NÃO 'mailpit'. Três containers atendem pelo nome
  # 'mailpit' na rede web (o central, o do feedpass e o do encomendas) e o DNS
  # do Docker faz round-robin entre eles — o e-mail cai numa caixa aleatória,
  # sem erro nenhum. O alias exclusivo foi criado no compose da infra.
  # Detalhes na seção 10.4 do BOAS_PRATICAS.md.
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit-central
  MAIL_PORT: 1025

  # ⚠️ Fica 'false' de propósito. O redirect global HTTP→HTTPS da infra (FASE 2
  # no traefik.yml) ainda está desligado, então http://tasks.localhost continua
  # respondendo — e com o cookie marcado como Secure o login por http falharia
  # EM SILÊNCIO (volta para a tela de login, sem erro nenhum). Ligue junto com a
  # FASE 2, não antes.
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-false}

  # Opcache em runtime (ver docker/php/entrypoint.sh). Default: revalida no
  # máximo a cada 2 s, então editar PHP aparece sozinho.
  # OPCACHE_VALIDATE_TIMESTAMPS=0 liga o modo turbo — exige
  # `docker compose restart taskon-app` a cada alteração.
  OPCACHE_VALIDATE_TIMESTAMPS: ${OPCACHE_VALIDATE_TIMESTAMPS:-1}
  OPCACHE_REVALIDATE_FREQ: ${OPCACHE_REVALIDATE_FREQ:-2}

x-php-service: &php-service
  build:
    context: ./docker/php
  image: taskon/php:8.3
  volumes:
    - .:/var/www/html
    # ⚠️ PERFORMANCE: vendor/ fica num VOLUME do Docker (disco Linux), não no
    # bind mount do Windows, onde cada stat() custa alguns milissegundos e uma
    # request toca centenas de arquivos.
    # Consequência: mudou composer.json/lock? rode
    # `docker compose exec taskon-app composer install`. O vendor/ do Windows é
    # OUTRO — é o que a IDE e o artisan de fora do Docker enxergam.
    - vendor:/var/www/html/vendor
  environment: *php-env
  networks:
    - taskon   # FastCGI com o nginx, isolado do resto
    - web      # alcança 'mariadb' e 'mailpit' da infra

services:
  # ------------------------------------------------- preparação (roda uma vez)
  taskon-init:
    <<: *php-service
    container_name: taskon-init
    command: ["init.sh"]
    restart: "no"

  # --------------------------------------------------------------- aplicação
  taskon-app:
    <<: *php-service
    container_name: taskon-app
    restart: unless-stopped
    depends_on:
      taskon-init:
        condition: service_completed_successfully

  taskon-nginx:
    image: nginx:1.27-alpine
    container_name: taskon-nginx
    restart: unless-stopped
    volumes:
      # Somente leitura: o nginx só precisa de public/ e storage/app/public.
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - taskon-app
    networks:
      - taskon   # FastCGI com o php-fpm
      - web      # exposto ao Traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.taskon.rule=Host(`tasks.localhost`)"
      # SEM 'entrypoints': assim o router se liga a TODOS eles e responde em
      # http:// e https://. Fixar 'entrypoints=web' o prenderia à porta 80 e ele
      # sumiria em HTTPS com "404 page not found".
      # O TLS vem do entrypoint (traefik.yml da infra) — nada de 'tls=true'.
      - "traefik.http.services.taskon.loadbalancer.server.port=80"
      # Sem 'auth@file': o app já tem login próprio. Duas senhas em sequência só
      # atrapalhariam.

  # -------------------------------------------------------------------- filas
  # O Taskon ainda não enfileira nada (e-mail de recuperação de senha vai
  # síncrono), então não existe worker aqui. Ao criar o primeiro Job, acrescente:
  #
  # taskon-queue:
  #   <<: *php-service
  #   container_name: taskon-queue
  #   command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
  #   restart: unless-stopped
  #   stop_signal: SIGTERM
  #   stop_grace_period: 30s
  #   depends_on:
  #     taskon-init:
  #       condition: service_completed_successfully

volumes:
  vendor:

networks:
  # Rede privada só deste projeto: o php-fpm (porta 9000) não fica alcançável
  # por todo container da rede compartilhada.
  taskon:
    driver: bridge
  # Rede do Traefik e dos serviços compartilhados. 'external: true' = este
  # compose só USA a rede; quem a cria é o projeto da infra.
  web:
    external: true
